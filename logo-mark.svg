<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 108" role="img" aria-label="Mission Control AV logo mark">
  <!-- Waveform legs forming an M, center bar as transmission mast -->
  <g fill="#FFB000">
    <rect x="13" y="35" width="10" height="55" rx="2"/>
    <rect x="27" y="55" width="10" height="35" rx="2"/>
    <rect x="41" y="72" width="10" height="18" rx="2"/>
    <rect x="55" y="12" width="10" height="78" rx="2"/>
    <rect x="69" y="72" width="10" height="18" rx="2"/>
    <rect x="83" y="55" width="10" height="35" rx="2"/>
    <rect x="97" y="35" width="10" height="55" rx="2"/>
  </g>
  <!-- Signal node atop the mast -->
  <g stroke="#4FD1C5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M52 6 A9 9 0 0 1 68 6"/>
    <path d="M48 0 A15 15 0 0 1 72 0" opacity="0.55"/>
  </g>
  <circle cx="60" cy="9" r="4" fill="#4FD1C5"/>
</svg>
